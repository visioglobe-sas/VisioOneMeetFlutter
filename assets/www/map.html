<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <title>VisioOne Map</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
    }
    #container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
  <!--
    Bundle UMD (pas le build ESM `visioone.js`) : chargé comme script classique,
    il fonctionne aussi bien servi en https:// (Android) qu'en file:// (iOS),
    contrairement au build ESM dont les `import()` dynamiques échouent sous
    file:// à cause des restrictions CORS de WebKit. C'est la même leçon que
    VisioOneMeetIos (voir docs/INTEGRATION.md de ce dépôt) et le même problème
    que VisioOneMeetRN a rencontré en chargeant l'ESM depuis un CDN.
  -->
  <script src="visioone.umd.cjs"></script>
</head>
<body>
  <div id="container"></div>

  <script>
    (function () {
      var visioOne = null;
      var venue = null;
      var view = null;
      var container = document.getElementById('container');

      // État de la démo `dynamic-poi-crud` : le POI (et son label) créés à
      // la volée, actuellement suivis — un seul à la fois (contrat de cette
      // démo, pas une limite du SDK). Remis à `null` par `setup()` en cas de
      // rechargement de carte, et par `removeDynamicPOI` ci-dessous. Voir
      // docs/features/dynamic-poi-crud.md.
      var dynamicPoi = null;
      var dynamicPoiLabel = null;

      // ---------------------------------------------------------------
      // JS -> Native : un seul canal, un contrat de messages {type, data}.
      // Voir docs/COMMUNICATION_GUIDE.md pour la liste des types de messages.
      // ---------------------------------------------------------------
      function sendToNative(type, data) {
        var bridge = window.VisioOneBridge;
        if (!bridge) {
          // Pas dans la WebView Flutter (ex. test dans un navigateur classique).
          console.log('[VisioOne:web]', type, data);
          return;
        }
        bridge.postMessage(JSON.stringify({ type: type, data: data }));
      }

      function forwardViewEvents(v) {
        v.addEventListener('poiclick', function (event) {
          var poi = event.pois && event.pois[0];
          if (!poi) return;
          sendToNative('poiSelected', {
            id: poi.id,
            name: poi.labels && poi.labels[0] ? poi.labels[0].text : null,
          });
        });

        v.addEventListener('currentfloorchanged', function (event) {
          sendToNative('floorChanged', {
            buildingId: event.floor && event.floor.building ? event.floor.building.id : null,
            floorId: event.floor ? event.floor.id : null,
          });
        });
      }

      // ---------------------------------------------------------------
      // Native -> JS : window.MapBridge, une méthode par commande.
      //
      // Chaque appel est généré côté Dart via `jsonEncode(valeur)` interpolé
      // dans le script (ex. `window.MapBridge.goToPOI("B1-UL00-01")`) : c'est
      // du texte JSON, mais il est *évalué comme code JS* par le moteur qui
      // exécute le script, pas relu comme texte par la fonction appelée.
      // Les paramètres ci-dessous reçoivent donc déjà de vraies valeurs JS
      // (string, boolean, objet...), jamais du texte JSON à re-parser —
      // ne PAS appeler `JSON.parse()` dessus (ce fut un bug réel de ce
      // squelette : voir l'historique de `map.html`, ça produisait un
      // `SyntaxError` silencieux qui bloquait `setup()` indéfiniment).
      // ---------------------------------------------------------------
      window.onerror = function (message, source, lineno, colno, error) {
        console.error('[MapBridge] erreur non interceptée:', message, 'at', lineno + ':' + colno);
        sendToNative('error', { message: 'Erreur JS non interceptée: ' + message });
      };

      window.MapBridge = {
        setup: function (hash) {
          try {
            console.log('[MapBridge] setup, hash =', hash, ', typeof VisioOne =', typeof VisioOne);

            if (visioOne) {
              // setup() déjà appelé : on repart d'un état propre avant de recharger.
              if (view) { visioOne.destroyView(view); view = null; }
              if (venue) { visioOne.unloadVenue(venue); venue = null; }
              dynamicPoi = null;
              dynamicPoiLabel = null;
            }

            visioOne = VisioOne.createVisioOne();
            sendToNative('loading', { hash: hash });

            console.log('[MapBridge] appel loadVenue...');
            visioOne
              .loadVenue({ hash: hash }, container)
              .then(function (v) {
                console.log('[MapBridge] loadVenue résolu, appel createView...');
                venue = v;
                return visioOne.createView(container, venue);
              })
              .then(function (createdView) {
                console.log('[MapBridge] createView résolu, carte prête.');
                view = createdView;
                forwardViewEvents(view);
                sendToNative('ready', null);
              })
              .catch(function (error) {
                console.error('[MapBridge] échec loadVenue/createView:', error);
                visioOne.showError(error, container);
                sendToNative('error', {
                  message: error && error.message ? error.message : String(error),
                });
              });
          } catch (error) {
            console.error('[MapBridge] erreur synchrone dans setup():', error);
            sendToNative('error', {
              message: error && error.message ? error.message : String(error),
            });
          }
        },

        goToGlobal: function () {
          if (view) view.goToGlobal();
        },

        goToPOI: function (poiId) {
          if (!venue || !view) return;
          var poi = venue.pois.find(function (p) { return p.id === poiId; });
          if (!poi) return;
          view.goToFloor(poi.floor).then(function () {
            view.goToPOI(poi);
          });
        },

        goToFloor: function (buildingId, floorId) {
          if (!venue || !view) return;
          var building = venue.venueLayout.buildings.find(function (b) { return b.id === buildingId; });
          if (!building) return;
          if (floorId) {
            var floor = building.floors.find(function (f) { return f.id === floorId; });
            if (floor) view.goToFloor(floor);
          } else {
            view.goToBuilding(building);
          }
        },

        // Requête/réponse (même schéma que startItinerary / itineraryComputed) :
        // Building/Floor n'exposent ni nom ni libellé côté SDK (voir
        // Building.d.ts/Floor.d.ts du package @visioglobe/visioone — seulement
        // `id`, `floors`, `defaultFloorID` pour Building, `id`, `altitude`,
        // `levelIndex` pour Floor), exactement comme le floor-selector natif du
        // SDK lui-même, qui affiche `levelIndex.toString()` faute de mieux
        // (vu dans visioone.umd.cjs). On renvoie donc `levelIndex`, à charge du
        // natif de l'afficher (ex. "Floor 2", "Floor -1"), triés du plus haut
        // au plus bas comme un panneau d'ascenseur. `currentBuildingId`/
        // `currentFloorId` permettent de présélectionner le bon bouton dès
        // l'ouverture du panneau, sans attendre un `floorChanged`.
        getVenueLayout: function () {
          if (!venue || !view) return;
          sendToNative('venueLayout', {
            currentBuildingId: view.currentBuilding ? view.currentBuilding.id : null,
            currentFloorId: view.currentFloor ? view.currentFloor.id : null,
            buildings: venue.venueLayout.buildings.map(function (building) {
              return {
                id: building.id,
                defaultFloorId: building.defaultFloorID,
                floors: building.floors
                  .slice()
                  .sort(function (a, b) { return b.levelIndex - a.levelIndex; })
                  .map(function (floor) {
                    return { id: floor.id, levelIndex: floor.levelIndex };
                  }),
              };
            }),
          });
        },

        clearSelection: function () {
          if (!venue) return;
          venue.pois.forEach(function (poi) {
            poi.surfaces.forEach(function (surface) {
              venue.updateSurface(surface, { selectionColor: undefined });
            });
          });
        },

        startItinerary: function (args) {
          if (!venue || !view) return;
          var navigation = venue.computeNavigation({
            origin: args.origin,
            destination: args.destination,
            isAccessible: !!args.isAccessible,
            type: 'fastest',
            firstNodeAsIntersection: false,
            mergeFloorChangeInstructions: false,
          });
          var trace = venue.createNavigationTrace(navigation);
          view.setCurrentNavigationTrace(trace);
          sendToNative('itineraryComputed', { instructions: navigation.instructions });
        },

        setUIPartVisible: function (part, visible) {
          if (!view) return;
          view.setUIPartVisible(part, visible);
        },

        updateOccupancy: function (occupancy) {
          if (!venue) return;
          occupancy.forEach(function (entry) {
            var poi = venue.pois.find(function (p) { return p.id === entry.planId; });
            if (!poi) return;
            poi.surfaces.forEach(function (surface) {
              venue.updateSurface(surface, { color: entry.color });
            });
          });
        },

        // Rend la/les surface(s) d'un POI cliquables : le SDK gère lui-même
        // le survol/tap (hoverColor/selectionColor) sans qu'aucun listener ne
        // soit nécessaire côté app pour ce changement de couleur — c'est
        // `isInteractive: true` qui active ce comportement. `color` est la
        // couleur "au repos" ; on la remet à `'initial'` (pas `undefined`,
        // voir docs/features/clickable-surface.md) en désactivant, pour ne
        // pas laisser la surface bloquée sur une couleur custom précédente.
        setSurfaceInteractive: function (placeId, interactive) {
          if (!venue) return;
          var poi = venue.pois.find(function (p) { return p.id === placeId; });
          if (!poi) return;
          poi.surfaces.forEach(function (surface) {
            venue.updateSurface(
              surface,
              interactive
                ? { isInteractive: true, color: '#2ECC71', hoverColor: '#F1C40F', selectionColor: '#E74C3C' }
                : { isInteractive: false, color: 'initial' },
            );
          });
        },

        // Requête/réponse (même schéma que getVenueLayout / venueLayout) :
        // un POI n'a pas de lat/lng directement (voir POI.d.ts du package
        // @visioglobe/visioone) — sa position WGS84 vient de son marker, ou à
        // défaut de son label, ou à défaut de son image, toutes trois portant
        // une `Position` (`{latitude, longitude, altitude?}`) au même format
        // que celui attendu par `injectTrackedPosition`. `requestId` est
        // renvoyé tel quel pour permettre plusieurs requêtes concurrentes
        // (origine + destination) sans les confondre côté Dart.
        resolvePoiPosition: function (requestId, poiId) {
          if (!venue) return;
          var poi = venue.pois.find(function (p) { return p.id === poiId; });
          var source = poi
            ? (poi.markers[0] || poi.labels[0] || poi.images[0])
            : null;
          var position = source
            ? { latitude: source.position.latitude, longitude: source.position.longitude }
            : null;
          sendToNative('poiPositionResolved', { requestId: requestId, poiId: poiId, position: position });
        },

        // Injecte/actualise une position simulée trackée + son cercle de
        // précision (mètres). `view.allowTracking` doit être à `true` avant
        // le premier appel à `injectTrackedPosition`, sans quoi le SDK lève
        // une exception (voir View.ts) : on l'active systématiquement ici
        // plutôt que d'exposer une commande séparée, ce booléen n'ayant pas
        // d'autre usage dans cette démo.
        injectTrackedPosition: function (latitude, longitude, precisionCircleRadius) {
          if (!view) return;
          view.allowTracking = true;
          view.injectTrackedPosition({
            position: { latitude: latitude, longitude: longitude },
            precisionCircleRadius: precisionCircleRadius,
          });
        },

        // Pas de méthode dédiée côté SDK pour "effacer" le marqueur/cercle
        // trackés : c'est `allowTracking = false` qui les retire de la carte
        // (voir docs/features/simulated-position.md, "Points d'attention").
        stopTrackedPosition: function () {
          if (!view) return;
          view.allowTracking = false;
        },

        // Verrouille/déverrouille le focus caméra sur la position trackée
        // courante (`view.lockCameraPositionOnTracking`). D'après le
        // commentaire de View.ts côté SDK, ce booléen "won't have any effect
        // if flag 'allowTracking' isn't set to true" : contrairement à
        // `injectTrackedPosition`, aucune exception n'est levée si on
        // l'active avant — pas besoin de garde ici. Ne gère pas
        // `lockCameraOrientationOnTracking` (verrouillage de l'orientation,
        // nécessite les données du capteur d'orientation de l'appareil) :
        // hors scope, voir docs/features/camera-lock-on-position.md.
        setCameraLockOnPosition: function (locked) {
          if (!view) return;
          view.lockCameraPositionOnTracking = !!locked;
        },

        // Enchaîne les deux appels SDK de cette démo : `venue.refreshCustomData()`
        // ((re)charge le cache de CustomData métier depuis le serveur — vide tant
        // qu'il n'a jamais été appelé) puis, une fois résolu ou rejeté,
        // `venue.getPOICustomData(poi)` (lecture synchrone, renvoie toujours un
        // objet — jamais null/undefined — vide `{}` si le POI n'a pas de
        // CustomData). `refreshCustomData()` rejette si aucune CustomData n'est
        // publiée pour cette carte (404 sur customData.json, cas de la carte de
        // démo partagée à ce jour) : un état normal pour une démo sans données
        // publiées, pas une erreur à faire remonter au natif — on l'avale ici
        // (juste un warning console) et on continue, `getPOICustomData`
        // renverra `{}` de toute façon. Requête/réponse (même schéma que
        // resolvePoiPosition / poiPositionResolved), `poiId` recherché comme
        // dans goToPOI. Voir docs/features/custom-data.md.
        loadCustomData: function (requestId, poiId) {
          if (!venue) {
            sendToNative('customDataLoaded', { requestId: requestId, poiId: poiId, found: false, customData: null });
            return;
          }
          venue
            .refreshCustomData()
            .catch(function (error) {
              console.warn(
                '[MapBridge] refreshCustomData a échoué (probablement aucune CustomData publiée pour cette carte) :',
                error,
              );
            })
            .then(function () {
              var poi = venue.pois.find(function (p) { return p.id === poiId; });
              if (!poi) {
                sendToNative('customDataLoaded', { requestId: requestId, poiId: poiId, found: false, customData: null });
                return;
              }
              sendToNative('customDataLoaded', {
                requestId: requestId,
                poiId: poiId,
                found: true,
                customData: venue.getPOICustomData(poi),
              });
            });
        },

        // Requête/réponse (même schéma que getVenueLayout / venueLayout) :
        // renvoie la liste des catégories de la venue courante, telle
        // qu'exposée par `venue.categories` (`Category = { readonly id:
        // string }`). `id` est un identifiant interne brut (une chaîne
        // numérique sur la carte de démo partagée, ex. "1".."11"), pas un
        // libellé -- confirmé en direct. Le nom lisible vient de
        // `venue.translator.translateCategory()`, même idiome qu'utiliserait
        // un libellé de bâtiment/étage ailleurs. `id` sert au filtrage/à la
        // mise en avant, `label` est uniquement pour l'affichage. Voir
        // docs/features/category-highlight.md.
        getCategories: function (requestId) {
          if (!venue) {
            sendToNative('categoriesLoaded', { requestId: requestId, categories: [] });
            return;
          }
          var locale = venue.currentLocale;
          sendToNative('categoriesLoaded', {
            requestId: requestId,
            categories: venue.categories.map(function (c) {
              var translated = venue.translator.translateCategory(c, locale);
              return { id: c.id, label: (translated && translated.name) || c.id };
            }),
          });
        },

        // Met en avant tous les POI portant la catégorie [categoryId] : pas
        // de méthode SDK dédiée pour "highlight by category", construite ici
        // à partir de primitives — `venue.pois.filter(...)` sur
        // `poi.categories` (un POI peut avoir plusieurs catégories) puis
        // `venue.updateSurface(surface, { color })` par surface de chaque POI
        // trouvé, exactement comme `updateOccupancy`/`setSurfaceInteractive`
        // ci-dessus. Un POI sans surface (marker/label seul) ne se surligne
        // simplement pas visuellement : `poi.surfaces` y est un tableau vide,
        // ce n'est pas un bug. Le natif ([VisioOneController.highlightCategory])
        // est responsable de réinitialiser la catégorie précédemment mise en
        // avant avant d'appeler ceci, pour ne jamais en cumuler deux.
        highlightCategory: function (categoryId) {
          if (!venue) return;
          venue.pois
            .filter(function (poi) {
              return poi.categories.some(function (c) { return c.id === categoryId; });
            })
            .forEach(function (poi) {
              poi.surfaces.forEach(function (surface) {
                venue.updateSurface(surface, { color: '#FF6B00' });
              });
            });
        },

        // Réinitialise ('initial', pas `undefined` — voir
        // docs/features/clickable-surface.md pour la même remarque sur
        // `setSurfaceInteractive` — seul `'initial'` restaure la couleur
        // définie par le bundle de carte) les surfaces de tous les POI
        // portant la catégorie [categoryId].
        clearCategoryHighlight: function (categoryId) {
          if (!venue) return;
          venue.pois
            .filter(function (poi) {
              return poi.categories.some(function (c) { return c.id === categoryId; });
            })
            .forEach(function (poi) {
              poi.surfaces.forEach(function (surface) {
                venue.updateSurface(surface, { color: 'initial' });
              });
            });
        },

        // Requête/réponse (même schéma que loadCustomData / customDataLoaded) :
        // crée un POI purement logique (`venue.createPOI({id: newId})`) — un
        // POI neuf n'a par lui-même aucune représentation visuelle
        // (`images`/`labels`/`lines`/`surfaces`/`markers` tous vides, voir
        // POI.ts du SDK) — puis lui attache immédiatement un Label
        // (`venue.createLabel`) pour le rendre visible/démontrable, dont la
        // position WGS84 est copiée depuis un POI "ancre" déjà existant
        // ([anchorId], résolu comme dans goToPOI/loadCustomData) : son
        // premier label, sinon son premier marker (pas de "tap sur la carte
        // pour placer" dans cette démo). `success: false` avec un `message`
        // explicite dans trois cas, tous des états normaux de la démo, pas
        // des crashs : id [newId] déjà pris (`POIAlreadyExistsError`, voir
        // Errors/POIAlreadyExistsError.ts), ancre introuvable, ou ancre sans
        // label ni marker dont copier la position. Voir
        // docs/features/dynamic-poi-crud.md.
        createDynamicPOI: function (requestId, newId, anchorId, labelText) {
          if (!venue) {
            sendToNative('dynamicPoiCreated', { requestId: requestId, success: false, message: 'Map not ready.' });
            return;
          }

          var anchor = venue.pois.find(function (p) { return p.id === anchorId; });
          if (!anchor) {
            sendToNative('dynamicPoiCreated', {
              requestId: requestId,
              success: false,
              message: 'Anchor POI "' + anchorId + '" not found.',
            });
            return;
          }

          var source = anchor.labels[0] || anchor.markers[0];
          if (!source) {
            sendToNative('dynamicPoiCreated', {
              requestId: requestId,
              success: false,
              message: 'Anchor POI "' + anchorId + '" has no label or marker to copy a position from.',
            });
            return;
          }

          var poi;
          try {
            poi = venue.createPOI({ id: newId });
          } catch (error) {
            // POIAlreadyExistsError (thrown synchronously by venue.createPOI
            // when newId is already used in the venue) — a normal, demoable
            // state for this feature, not a crash.
            sendToNative('dynamicPoiCreated', {
              requestId: requestId,
              success: false,
              message: error && error.message ? error.message : 'Could not create POI "' + newId + '".',
            });
            return;
          }

          var label = venue.createLabel({
            poi: poi,
            position: source.position,
            width: 2,
            text: labelText,
          });

          dynamicPoi = poi;
          dynamicPoiLabel = label;
          sendToNative('dynamicPoiCreated', { requestId: requestId, success: true, poiId: newId, text: labelText });
        },

        // Seule "modification" possible du contenu visuel d'un POI dynamique
        // dans cette démo : `venue.updatePOI` ne peut toucher qu'aux
        // catégories du POI (voir POIUpdateOptions.ts), jamais à sa
        // représentation visuelle — c'est `venue.updateLabel` sur le Label
        // attaché à la création qui joue ce rôle ici. Requête/réponse (même
        // schéma que createDynamicPOI ci-dessus). Voir
        // docs/features/dynamic-poi-crud.md.
        updateDynamicPoiLabelText: function (requestId, text) {
          if (!dynamicPoiLabel) {
            sendToNative('dynamicPoiLabelUpdated', {
              requestId: requestId,
              success: false,
              message: 'No dynamic POI tracked.',
            });
            return;
          }
          venue.updateLabel(dynamicPoiLabel, { text: text });
          sendToNative('dynamicPoiLabelUpdated', { requestId: requestId, success: true, text: text });
        },

        // `venue.removePOI` retire le POI ET cascade sur tout élément visuel
        // attaché (ici, le Label créé par createDynamicPOI) : pas besoin d'un
        // removeLabel séparé. Requête/réponse (même schéma que
        // createDynamicPOI ci-dessus). Voir docs/features/dynamic-poi-crud.md.
        removeDynamicPOI: function (requestId) {
          if (!dynamicPoi) {
            sendToNative('dynamicPoiRemoved', {
              requestId: requestId,
              success: false,
              message: 'No dynamic POI tracked.',
            });
            return;
          }
          venue.removePOI(dynamicPoi);
          dynamicPoi = null;
          dynamicPoiLabel = null;
          sendToNative('dynamicPoiRemoved', { requestId: requestId, success: true });
        },

        // Requête/réponse (même schéma que getVenueLayout / venueLayout) :
        // renvoie la locale courante (`venue.currentLocale`) et la liste des
        // locales disponibles pour cette venue (`venue.translator.allLocales`).
        // Sur la carte de démo partagée, `allLocales` vaut
        // `['default', 'en', 'fr']` où `'default'` s'avère être un doublon
        // (octet pour octet identique, confirmé en direct) du français —
        // c'est le natif qui ne présente que `'en'`/`'fr'` à l'utilisateur,
        // pas ce pont. Voir docs/features/runtime-locale.md.
        getLocales: function (requestId) {
          if (!venue) {
            sendToNative('localesLoaded', { requestId: requestId, currentLocale: null, allLocales: [] });
            return;
          }
          sendToNative('localesLoaded', {
            requestId: requestId,
            currentLocale: venue.currentLocale,
            allLocales: venue.translator.allLocales,
          });
        },

        // Change la locale courante de la venue (`venue.setCurrentLocale`,
        // `Promise<void>`). D'après sa TSDoc (Venue.ts) le SDK se charge
        // lui-même de re-rendre les labels de POI (via leur `POILocaleEntry`
        // pour cette locale) et toute UI courante (dont la Navigation en
        // cours) dans la nouvelle locale dès que la Promise se résout —
        // aucun re-fetch manuel de données POI n'est nécessaire côté natif,
        // ni aucun message de confirmation dédié : le résultat est
        // directement observable sur la carte. Voir
        // docs/features/runtime-locale.md.
        setCurrentLocale: function (locale) {
          if (!venue) return;
          venue.setCurrentLocale(locale).catch(function (error) {
            console.error('[MapBridge] setCurrentLocale a échoué:', error);
          });
        },
      };

      // Permet de tester map.html directement dans un navigateur (npm run dev)
      // sans passer par la WebView Flutter.
      window.addEventListener('DOMContentLoaded', function () {
        sendToNative('pageReady', null);
      });
    })();
  </script>
</body>
</html>
