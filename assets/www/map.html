<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <title>VisioOne Map</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
    }
    #container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
  <!--
    Bundle UMD (pas le build ESM `visioone.js`) : chargé comme script classique,
    il fonctionne aussi bien servi en https:// (Android) qu'en file:// (iOS),
    contrairement au build ESM dont les `import()` dynamiques échouent sous
    file:// à cause des restrictions CORS de WebKit. C'est la même leçon que
    VisioOneMeetIos (voir docs/INTEGRATION.md de ce dépôt) et le même problème
    que VisioOneMeetRN a rencontré en chargeant l'ESM depuis un CDN.
  -->
  <script src="visioone.umd.cjs"></script>
</head>
<body>
  <div id="container"></div>

  <script>
    (function () {
      var visioOne = null;
      var venue = null;
      var view = null;
      var container = document.getElementById('container');

      // État de la démo `dynamic-poi-crud` : le POI (et son label) créés à
      // la volée, actuellement suivis — un seul à la fois (contrat de cette
      // démo, pas une limite du SDK). Remis à `null` par `setup()` en cas de
      // rechargement de carte, et par `removeDynamicPOI` ci-dessous. Voir
      // docs/features/dynamic-poi-crud.md.
      var dynamicPoi = null;
      var dynamicPoiLabel = null;

      // Trace créée par `startItinerary`, retenue ici pour que
      // `updateNavigationTrace` (démo `custom-navigation-trace`) puisse la
      // restyler après coup — `venue.updateNavigationTrace()` prend l'objet
      // `NavigationTrace` lui-même, pas un id. Remise à `null` par `setup()`
      // en cas de rechargement de carte, comme `dynamicPoi` ci-dessus. Voir
      // docs/features/custom-navigation-trace.md.
      var currentNavigationTrace = null;

      // Images créées par la démo `3d-icon-marker` (`venue.createImage`),
      // indexées par un id choisi côté natif : `venue.updateImage` /
      // `venue.removeImage` prennent l'objet `Image` lui-même, qui ne peut
      // pas traverser le pont. Vidé par `setup()` en cas de rechargement de
      // carte, comme `dynamicPoi` ci-dessus. Voir docs/features/3d-icon-marker.md.
      var iconImages = {};

      // Label texte créé par la démo `custom-text-label`
      // (`venue.createLabel`), et les options avec lesquelles il a été créé :
      // `rotation` n'existe que dans `LabelCreateOptions` (pas dans
      // `LabelUpdateOptions`), donc changer la rotation d'un label placé
      // impose de le retirer puis de le recréer avec les mêmes valeurs.
      // Une seule instance à la fois. Vidé par `setup()` en cas de
      // rechargement de carte. Voir docs/features/custom-text-label.md.
      var textLabel = null;
      var textLabelOptions = null;

      // Badge HTML créé par la démo `html-overlay-marker`
      // (`venue.createMarker({ poi, position, element })`) et son compteur de
      // taps (remis à 0 à chaque placement réussi). Le `Marker` du SDK (et
      // son élément DOM) ne peuvent pas traverser le pont : ils restent ici.
      // Une seule instance à la fois. Vidé par `setup()` en cas de
      // rechargement de carte. Voir docs/features/html-overlay-marker.md.
      var htmlBadge = null;
      var htmlBadgeTapCount = 0;
      var HTML_BADGE_STYLE =
        'background:#0B6BCB;color:#FFFFFF;font:600 14px sans-serif;padding:6px 12px;' +
        'border-radius:14px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer';

      // ---------------------------------------------------------------
      // JS -> Native : un seul canal, un contrat de messages {type, data}.
      // Voir docs/COMMUNICATION_GUIDE.md pour la liste des types de messages.
      // ---------------------------------------------------------------
      // Résout un POI "ancre" existant par son id et la position WGS84 à
      // copier depuis lui : son premier label, sinon son premier marker.
      // Partagé par `dynamic-poi-crud` (createDynamicPOI) et `3d-icon-marker`
      // (placeIconImage). Renvoie `{ poi, position }`, ou `{ error }` avec
      // `error` = 'notFound' (aucun POI de cet id) ou 'noPosition' (POI sans
      // label ni marker) — deux états normaux des démos, pas des crashs ;
      // chaque appelant formule son propre message.
      // `ignoredLabel` / `ignoredMarker` (optionnels) : un label / marker
      // créé par la démo elle-même et encore attaché au POI, à ne jamais
      // utiliser comme source de position (`custom-text-label` et
      // `html-overlay-marker` résolvent l'ancre avant de retirer le leur).
      function resolveAnchor(anchorId, ignoredLabel, ignoredMarker) {
        var poi = venue.pois.find(function (p) { return p.id === anchorId; });
        if (!poi) return { error: 'notFound' };
        var ownLabels = poi.labels.filter(function (l) { return l !== ignoredLabel; });
        var ownMarkers = poi.markers.filter(function (m) { return m !== ignoredMarker; });
        var source = ownLabels[0] || ownMarkers[0];
        if (!source) return { poi: poi, error: 'noPosition' };
        return { poi: poi, position: source.position };
      }

      function sendToNative(type, data) {
        var bridge = window.VisioOneBridge;
        if (!bridge) {
          // Pas dans la WebView Flutter (ex. test dans un navigateur classique).
          console.log('[VisioOne:web]', type, data);
          return;
        }
        bridge.postMessage(JSON.stringify({ type: type, data: data }));
      }

      function forwardViewEvents(v) {
        v.addEventListener('poiclick', function (event) {
          var poi = event.pois && event.pois[0];
          if (!poi) return;
          sendToNative('poiSelected', {
            id: poi.id,
            name: poi.labels && poi.labels[0] ? poi.labels[0].text : null,
          });
        });

        v.addEventListener('currentfloorchanged', function (event) {
          sendToNative('floorChanged', {
            buildingId: event.floor && event.floor.building ? event.floor.building.id : null,
            floorId: event.floor ? event.floor.id : null,
          });
        });

        // Déclenché à chaque changement de `view.currentExploreMode`, quelle
        // qu'en soit la source — l'appel `setExploreMode` de ce pont
        // ci-dessous, mais aussi une interaction directe caméra/carte
        // (déplacer la caméra en/hors d'un bâtiment en mode 'global'
        // l'ouvre/le ferme ; un clic en mode 'building' bascule
        // automatiquement en mode 'floor'). Relayé sans condition pour que
        // le panneau natif reste synchronisé même quand ce n'est pas lui qui
        // a causé le changement — même schéma que `currentfloorchanged`
        // ci-dessus. Voir docs/features/explore-mode.md.
        v.addEventListener('exploremodechanged', function (event) {
          sendToNative('exploreModeChanged', { currentExploreMode: event.currentExploreMode });
        });

        // `camera-lock-on-position` : le SDK modifie lui-même
        // `lockCameraPositionOnTracking` — `allowTracking = true` le force à
        // `true` (event `trackingon`), `allowTracking = false` à `false`
        // (`trackingoff`), et un pan/une manipulation de la carte pendant le
        // tracking le repasse à `false` (`trackingchanged`, émis aussi par le
        // setter). Aucun de ces events ne porte la valeur : on relit la
        // propriété et on la relaie au natif, qui en fait la seule source de
        // vérité de l'interrupteur (pas d'état parallèle côté app). Voir
        // docs/features/camera-lock-on-position.md.
        function forwardCameraLock() {
          sendToNative('cameraLockChanged', { locked: !!v.lockCameraPositionOnTracking });
        }
        v.addEventListener('trackingon', forwardCameraLock);
        v.addEventListener('trackingoff', forwardCameraLock);
        v.addEventListener('trackingchanged', forwardCameraLock);
      }

      // ---------------------------------------------------------------
      // Native -> JS : window.MapBridge, une méthode par commande.
      //
      // Chaque appel est généré côté Dart via `jsonEncode(valeur)` interpolé
      // dans le script (ex. `window.MapBridge.goToPOI("B1-UL00-01")`) : c'est
      // du texte JSON, mais il est *évalué comme code JS* par le moteur qui
      // exécute le script, pas relu comme texte par la fonction appelée.
      // Les paramètres ci-dessous reçoivent donc déjà de vraies valeurs JS
      // (string, boolean, objet...), jamais du texte JSON à re-parser —
      // ne PAS appeler `JSON.parse()` dessus (ce fut un bug réel de ce
      // squelette : voir l'historique de `map.html`, ça produisait un
      // `SyntaxError` silencieux qui bloquait `setup()` indéfiniment).
      // ---------------------------------------------------------------
      window.onerror = function (message, source, lineno, colno, error) {
        console.error('[MapBridge] erreur non interceptée:', message, 'at', lineno + ':' + colno);
        sendToNative('error', { message: 'Erreur JS non interceptée: ' + message });
      };

      window.MapBridge = {
        // `baseURL` est optionnel (undefined si non fourni depuis Dart) :
        // le SDK retombe alors sur son défaut public,
        // https://mapserver.visioglobe.com/ (voir docs/features/custom-base-url.md).
        // C'est une option de `loadVenue`, pas une propriété mutable sur une
        // venue déjà chargée -- changer de baseURL passe donc entièrement
        // par ce chemin de rechargement, comme un changement de hash.
        //
        // `viewOptions` (optionnel, `null`/undefined par défaut) est passé
        // tel quel en 3e argument de `createView` — seule la démo
        // `custom-theme` le renseigne (`{ enableShadows: true }`, sans quoi
        // `view.setTheme` n'a aucun effet visible) ; toutes les autres
        // features gardent un `createView(container, venue)` inchangé. Voir
        // docs/features/custom-theme.md.
        setup: function (hash, baseURL, viewOptions) {
          try {
            console.log('[MapBridge] setup, hash =', hash, ', baseURL =', baseURL, ', viewOptions =', viewOptions, ', typeof VisioOne =', typeof VisioOne);

            if (visioOne) {
              // setup() déjà appelé : on repart d'un état propre avant de recharger.
              if (view) { visioOne.destroyView(view); view = null; }
              if (venue) { visioOne.unloadVenue(venue); venue = null; }
              dynamicPoi = null;
              dynamicPoiLabel = null;
              currentNavigationTrace = null;
              iconImages = {};
              textLabel = null;
              textLabelOptions = null;
              htmlBadge = null;
              htmlBadgeTapCount = 0;
            }

            visioOne = VisioOne.createVisioOne();
            sendToNative('loading', { hash: hash });

            console.log('[MapBridge] appel loadVenue...');
            visioOne
              .loadVenue(baseURL ? { vg_maphash: hash, baseURL: baseURL } : { vg_maphash: hash }, container)
              .then(function (v) {
                console.log('[MapBridge] loadVenue résolu, appel createView...');
                venue = v;
                return viewOptions
                  ? visioOne.createView(container, venue, viewOptions)
                  : visioOne.createView(container, venue);
              })
              .then(function (createdView) {
                console.log('[MapBridge] createView résolu, carte prête.');
                view = createdView;
                forwardViewEvents(view);
                sendToNative('ready', null);
              })
              .catch(function (error) {
                console.error('[MapBridge] échec loadVenue/createView:', error);
                visioOne.showError(error, container);
                sendToNative('error', {
                  message: error && error.message ? error.message : String(error),
                });
              });
          } catch (error) {
            console.error('[MapBridge] erreur synchrone dans setup():', error);
            sendToNative('error', {
              message: error && error.message ? error.message : String(error),
            });
          }
        },

        goToGlobal: function () {
          if (view) view.goToGlobal();
        },

        goToPOI: function (poiId) {
          if (!venue || !view) return;
          var poi = venue.pois.find(function (p) { return p.id === poiId; });
          if (!poi) return;
          view.goToFloor(poi.floor).then(function () {
            view.goToPOI(poi);
          });
        },

        goToFloor: function (buildingId, floorId) {
          if (!venue || !view) return;
          var building = venue.venueLayout.buildings.find(function (b) { return b.id === buildingId; });
          if (!building) return;
          if (floorId) {
            var floor = building.floors.find(function (f) { return f.id === floorId; });
            if (floor) view.goToFloor(floor);
          } else {
            view.goToBuilding(building);
          }
        },

        // Requête/réponse (même schéma que startItinerary / itineraryComputed) :
        // Building/Floor n'exposent ni nom ni libellé côté SDK (voir
        // Building.d.ts/Floor.d.ts du package @visioglobe/visioone — seulement
        // `id`, `floors`, `defaultFloorID` pour Building, `id`, `altitude`,
        // `levelIndex` pour Floor), exactement comme le floor-selector natif du
        // SDK lui-même, qui affiche `levelIndex.toString()` faute de mieux
        // (vu dans visioone.umd.cjs). On renvoie donc `levelIndex`, à charge du
        // natif de l'afficher (ex. "Floor 2", "Floor -1"), triés du plus haut
        // au plus bas comme un panneau d'ascenseur. `currentBuildingId`/
        // `currentFloorId` permettent de présélectionner le bon bouton dès
        // l'ouverture du panneau, sans attendre un `floorChanged`.
        getVenueLayout: function () {
          if (!venue || !view) return;
          sendToNative('venueLayout', {
            currentBuildingId: view.currentBuilding ? view.currentBuilding.id : null,
            currentFloorId: view.currentFloor ? view.currentFloor.id : null,
            buildings: venue.venueLayout.buildings.map(function (building) {
              return {
                id: building.id,
                defaultFloorId: building.defaultFloorID,
                floors: building.floors
                  .slice()
                  .sort(function (a, b) { return b.levelIndex - a.levelIndex; })
                  .map(function (floor) {
                    return { id: floor.id, levelIndex: floor.levelIndex };
                  }),
              };
            }),
          });
        },

        // Change le mode d'exploration courant du bâtiment — un parmi
        // 'global' / 'building' / 'floor' (voir ExploreMode.ts du package
        // @visioglobe/visioone pour la sémantique exacte de chacun, et
        // docs/features/explore-mode.md). Une simple affectation de
        // propriété, pas un appel de méthode : le SDK anime lui-même la
        // transition caméra/scène et déclenche `exploremodechanged` une fois
        // appliquée (voir `forwardViewEvents` ci-dessus) — aucun message de
        // confirmation séparé n'est envoyé ici, comme `setCurrentLocale`.
        setExploreMode: function (mode) {
          if (!view) return;
          view.currentExploreMode = mode;
        },

        // Requête/réponse (même schéma que getVenueLayout / venueLayout,
        // sans requestId puisqu'il n'y a jamais qu'un seul mode
        // d'exploration courant à répondre) : renvoie le mode d'exploration
        // courant (`view.currentExploreMode`) pour présélectionner le bon
        // bouton dès l'ouverture du panneau, sans attendre un
        // `exploremodechanged`. Voir docs/features/explore-mode.md.
        getExploreMode: function () {
          if (!view) return;
          sendToNative('exploreMode', { currentExploreMode: view.currentExploreMode });
        },

        clearSelection: function () {
          if (!venue) return;
          venue.pois.forEach(function (poi) {
            poi.surfaces.forEach(function (surface) {
              venue.updateSurface(surface, { selectionColor: undefined });
            });
          });
        },

        startItinerary: function (args) {
          if (!venue || !view) return;
          var navigation = venue.computeNavigation({
            origin: args.origin,
            destination: args.destination,
            isAccessible: !!args.isAccessible,
            type: 'fastest',
            firstNodeAsIntersection: false,
            mergeFloorChangeInstructions: false,
          });
          var trace = venue.createNavigationTrace(navigation);
          view.setCurrentNavigationTrace(trace);
          currentNavigationTrace = trace;
          sendToNative('itineraryComputed', { instructions: navigation.instructions });
        },

        // `navigation-exclude-modalities` : même calcul que `startItinerary`
        // ci-dessus, avec `excludedAttributes` en plus -- une "particularité"
        // de segment (ex. ascenseur) à exclure du graphe de routage. Le JSDoc
        // du SDK donne "elevator" comme exemple pour ce champ, mais la valeur
        // réellement taguée sur les segments d'ascenseur de cette venue
        // (confirmé en direct) est 'lift', pas 'elevator' -- voir
        // docs/features/navigation-exclude-modalities.md.
        //
        // Pas de try/catch ici, volontairement : un couple origine/destination
        // qu'aucune route ne relie une fois l'exclusion appliquée doit échouer
        // exactement comme un couple non relié pour `startItinerary` ci-dessus
        // (aucune trace, aucun message d'erreur explicite renvoyé au natif —
        // voir docs/features/compute-navigation.md).
        startItineraryExcludingModalities: function (args) {
          if (!venue || !view) return;
          var navigation = venue.computeNavigation({
            origin: args.origin,
            destination: args.destination,
            isAccessible: !!args.isAccessible,
            type: 'fastest',
            firstNodeAsIntersection: false,
            mergeFloorChangeInstructions: false,
            excludedAttributes: args.excludedAttributes || [],
          });
          var trace = venue.createNavigationTrace(navigation);
          view.setCurrentNavigationTrace(trace);
          currentNavigationTrace = trace;
          sendToNative('itineraryComputed', { instructions: navigation.instructions });
        },

        // `custom-navigation-trace` : restyle la trace actuellement affichée
        // (créée par `startItinerary` ci-dessus) via
        // `venue.updateNavigationTrace(trace, options)` -- `options` ne porte
        // que des couleurs (`progressColor`, `progressOutlineColor`,
        // `progressFutureColor`, `previewColor`, `previewOutlineColor`, plus
        // `textureRepeat`/`animationSpeed`, sans effet ici -- voir
        // `NavigationTraceUpdateOptions.d.ts` du package
        // @visioglobe/visioone) : aucun moyen de changer `displayMode` ou
        // l'épaisseur après création. No-op si aucune trace n'existe encore.
        //
        // `venue.updateNavigationTrace()` peut lever une exception interne
        // ("undefined is not an object (evaluating 'o.children[0].material')"
        // sous JavaScriptCore/WKWebView -- même bug que le `TypeError:
        // Cannot read properties of undefined (reading 'material')` de V8
        // côté Vue, tout au fond du pipeline de rendu de ligne du SDK) --
        // confirmé en direct sur ce dépôt (test d'intégration), mais
        // seulement au tout premier appel d'une session, pas à chaque appel
        // (voir docs/features/custom-navigation-trace.md pour le détail) --,
        // alors que chaque couleur de `options` est malgré tout bien
        // appliquée avant que l'exception ne soit levée. On l'avale ici
        // (simple warning console) plutôt que de la laisser remonter comme un
        // `error` non intercepté à `window.onerror` ci-dessus : ce n'est pas
        // un échec, juste un défaut du SDK sur cette trajectoire de code.
        updateNavigationTrace: function (options) {
          if (!venue || !currentNavigationTrace) return;
          try {
            venue.updateNavigationTrace(currentNavigationTrace, options);
          } catch (error) {
            // Un seul argument texte, pas l'objet `error` séparément : les
            // moteurs JS (et le relais console -> `debugPrint`, voir
            // VisioOneController._initialize) sérialisent souvent un `Error`
            // passé tel quel en argument séparé comme `{}` (JSON.stringify
            // d'un Error natif n'expose aucune propriété énumérable), ce qui
            // masquerait le vrai message ici.
            console.warn(
              '[MapBridge] updateNavigationTrace: le SDK a levé une exception (couleurs tout de même appliquées) : ' +
                (error && error.message ? error.message : String(error)),
            );
          }
        },

        setUIPartVisible: function (part, visible) {
          if (!view) return;
          view.setUIPartVisible(part, visible);
        },

        updateOccupancy: function (occupancy) {
          if (!venue) return;
          occupancy.forEach(function (entry) {
            var poi = venue.pois.find(function (p) { return p.id === entry.planId; });
            if (!poi) return;
            poi.surfaces.forEach(function (surface) {
              venue.updateSurface(surface, { color: entry.color });
            });
          });
        },

        // Rend la/les surface(s) d'un POI cliquables : le SDK gère lui-même
        // le survol/tap (hoverColor/selectionColor) sans qu'aucun listener ne
        // soit nécessaire côté app pour ce changement de couleur — c'est
        // `isInteractive: true` qui active ce comportement. `color` est la
        // couleur "au repos" ; on la remet à `'initial'` (pas `undefined`,
        // voir docs/features/clickable-surface.md) en désactivant, pour ne
        // pas laisser la surface bloquée sur une couleur custom précédente.
        setSurfaceInteractive: function (placeId, interactive) {
          if (!venue) return;
          var poi = venue.pois.find(function (p) { return p.id === placeId; });
          if (!poi) return;
          poi.surfaces.forEach(function (surface) {
            venue.updateSurface(
              surface,
              interactive
                ? { isInteractive: true, color: '#2ECC71', hoverColor: '#F1C40F', selectionColor: '#E74C3C' }
                : { isInteractive: false, color: 'initial' },
            );
          });
        },

        // Requête/réponse (même schéma que getVenueLayout / venueLayout) :
        // un POI n'a pas de lat/lng directement (voir POI.d.ts du package
        // @visioglobe/visioone) — sa position WGS84 vient de son marker, ou à
        // défaut de son label, ou à défaut de son image, toutes trois portant
        // une `Position` (`{latitude, longitude, altitude?}`) au même format
        // que celui attendu par `injectTrackedPosition`. `requestId` est
        // renvoyé tel quel pour permettre plusieurs requêtes concurrentes
        // (origine + destination) sans les confondre côté Dart.
        resolvePoiPosition: function (requestId, poiId) {
          if (!venue) return;
          var poi = venue.pois.find(function (p) { return p.id === poiId; });
          var source = poi
            ? (poi.markers[0] || poi.labels[0] || poi.images[0])
            : null;
          var position = source
            ? { latitude: source.position.latitude, longitude: source.position.longitude }
            : null;
          sendToNative('poiPositionResolved', { requestId: requestId, poiId: poiId, position: position });
        },

        // `geofencing` : résout le polygone WGS84 de la première surface
        // d'un POI ("zone" pour cette démo), à tester côté natif contre la
        // position trackée courante — le SDK n'expose aucune primitive de
        // geofencing/point-in-polygon, ce test est fait par l'app elle-même.
        // Contrairement à resolvePoiPosition (position ponctuelle
        // marker/label/image), on lit ici `surface.positions`
        // (`Position[]`, même forme `{latitude, longitude}` que celle
        // attendue par injectTrackedPosition, aucune conversion nécessaire).
        // `positions: null` si `poiId` ne correspond à aucun POI,
        // `positions: []` si le POI existe mais n'a aucune surface — deux
        // états distincts, laissés au natif d'afficher chacun son propre
        // message. Voir docs/features/geofencing.md.
        resolvePoiZone: function (requestId, poiId) {
          if (!venue) {
            sendToNative('poiZoneResolved', { requestId: requestId, poiId: poiId, positions: null });
            return;
          }
          var poi = venue.pois.find(function (p) { return p.id === poiId; });
          if (!poi) {
            sendToNative('poiZoneResolved', { requestId: requestId, poiId: poiId, positions: null });
            return;
          }
          var surface = poi.surfaces[0];
          var positions = surface
            ? surface.positions.map(function (pos) {
                return { latitude: pos.latitude, longitude: pos.longitude };
              })
            : [];
          sendToNative('poiZoneResolved', { requestId: requestId, poiId: poiId, positions: positions });
        },

        // `geofencing` : colore (ou réinitialise, `active: false`) la/les
        // surface(s) du POI zone comme alerte visuelle d'entrée/sortie de
        // zone — même idiome que updateOccupancy/highlightCategory
        // ci-dessus (`venue.updateSurface(surface, { color })`), `'initial'`
        // et non `undefined` pour restaurer la couleur du bundle de carte
        // (voir la même remarque sur setSurfaceInteractive). Le test
        // d'appartenance lui-même est fait côté natif, ce point d'entrée ne
        // fait qu'appliquer son résultat visuellement. Voir
        // docs/features/geofencing.md.
        setZoneAlert: function (placeId, active) {
          if (!venue) return;
          var poi = venue.pois.find(function (p) { return p.id === placeId; });
          if (!poi) return;
          poi.surfaces.forEach(function (surface) {
            venue.updateSurface(surface, { color: active ? '#E74C3C' : 'initial' });
          });
        },

        // Injecte/actualise une position simulée trackée + son cercle de
        // précision (mètres). `view.allowTracking` doit être à `true` avant
        // le premier appel à `injectTrackedPosition`, sans quoi le SDK lève
        // une exception (voir View.ts) : on l'active ici plutôt que
        // d'exposer une commande séparée, ce booléen n'ayant pas d'autre
        // usage dans cette démo — mais UNIQUEMENT à la transition
        // false -> true : chaque `allowTracking = true` force aussi
        // `lockCameraPositionOnTracking = true` côté SDK, le réaffecter à
        // chaque tick (~150 ms) reverrouillerait la caméra en permanence
        // (interrupteur "Camera lock" ou pan de la carte annulés aussitôt).
        injectTrackedPosition: function (latitude, longitude, precisionCircleRadius) {
          if (!view) return;
          if (!view.allowTracking) view.allowTracking = true;
          view.injectTrackedPosition({
            position: { latitude: latitude, longitude: longitude },
            precisionCircleRadius: precisionCircleRadius,
          });
        },

        // Pas de méthode dédiée côté SDK pour "effacer" le marqueur/cercle
        // trackés : c'est `allowTracking = false` qui les retire de la carte
        // (voir docs/features/simulated-position.md, "Points d'attention").
        stopTrackedPosition: function () {
          if (!view) return;
          view.allowTracking = false;
        },

        // Verrouille/déverrouille le focus caméra sur la position trackée
        // courante (`view.lockCameraPositionOnTracking`). D'après le
        // commentaire de View.ts côté SDK, ce booléen "won't have any effect
        // if flag 'allowTracking' isn't set to true" : contrairement à
        // `injectTrackedPosition`, aucune exception n'est levée si on
        // l'active avant — pas besoin de garde ici. L'interrupteur natif ne
        // change pas sa valeur lui-même : il suit l'event `trackingchanged`
        // que ce setter déclenche (voir forwardViewEvents). Ne gère pas
        // `lockCameraOrientationOnTracking` (verrouillage de l'orientation,
        // nécessite les données du capteur d'orientation de l'appareil) :
        // hors scope, voir docs/features/camera-lock-on-position.md.
        setCameraLockOnPosition: function (locked) {
          if (!view) return;
          view.lockCameraPositionOnTracking = !!locked;
        },

        // `accuracy-circle-style` : couleur/opacité du cercle de précision de la
        // position trackée (pas de la flèche centrale). Le SDK ne fait que stocker
        // ces options (appliquées au prochain injectTrackedPosition) et les
        // remet à ses valeurs par défaut (#0094f0, 0.3) dès que
        // `allowTracking` repasse à false — le natif les réapplique donc à
        // chaque Start. Couleur invalide ou opacité non numérique => throw
        // côté SDK, d'où le try/catch. Voir docs/features/accuracy-circle-style.md.
        updatePositionTrackerGraphicOptions: function (color, opacity) {
          if (!view) return;
          try {
            view.updatePositionTrackerGraphicOptions({ color: color, opacity: opacity });
          } catch (error) {
            console.error('[MapBridge] updatePositionTrackerGraphicOptions a échoué :', error);
          }
        },

        // Enchaîne les deux appels SDK de cette démo : `venue.refreshCustomData()`
        // ((re)charge le cache de CustomData métier depuis le serveur — vide tant
        // qu'il n'a jamais été appelé) puis, une fois résolu ou rejeté,
        // `venue.getPOICustomData(poi)` (lecture synchrone, renvoie toujours un
        // objet — jamais null/undefined — vide `{}` si le POI n'a pas de
        // CustomData). `refreshCustomData()` rejette si aucune CustomData n'est
        // publiée pour cette carte (404 sur customData.json, cas de la carte de
        // démo partagée à ce jour) : un état normal pour une démo sans données
        // publiées, pas une erreur à faire remonter au natif — on l'avale ici
        // (juste un warning console) et on continue, `getPOICustomData`
        // renverra `{}` de toute façon. Requête/réponse (même schéma que
        // resolvePoiPosition / poiPositionResolved), `poiId` recherché comme
        // dans goToPOI. Voir docs/features/custom-data.md.
        loadCustomData: function (requestId, poiId) {
          if (!venue) {
            sendToNative('customDataLoaded', { requestId: requestId, poiId: poiId, found: false, customData: null });
            return;
          }
          venue
            .refreshCustomData()
            .catch(function (error) {
              console.warn(
                '[MapBridge] refreshCustomData a échoué (probablement aucune CustomData publiée pour cette carte) :',
                error,
              );
            })
            .then(function () {
              var poi = venue.pois.find(function (p) { return p.id === poiId; });
              if (!poi) {
                sendToNative('customDataLoaded', { requestId: requestId, poiId: poiId, found: false, customData: null });
                return;
              }
              sendToNative('customDataLoaded', {
                requestId: requestId,
                poiId: poiId,
                found: true,
                customData: venue.getPOICustomData(poi),
              });
            });
        },

        // Requête/réponse (même schéma que getVenueLayout / venueLayout) :
        // renvoie la liste des catégories de la venue courante, telle
        // qu'exposée par `venue.categories` (`Category = { readonly id:
        // string }`). `id` est un identifiant interne brut (une chaîne
        // numérique sur la carte de démo partagée, ex. "1".."11"), pas un
        // libellé -- confirmé en direct. Le nom lisible vient de
        // `venue.translator.translateCategory()`, même idiome qu'utiliserait
        // un libellé de bâtiment/étage ailleurs. `id` sert au filtrage/à la
        // mise en avant, `label` est uniquement pour l'affichage. Voir
        // docs/features/category-highlight.md.
        getCategories: function (requestId) {
          if (!venue) {
            sendToNative('categoriesLoaded', { requestId: requestId, categories: [] });
            return;
          }
          var locale = venue.currentLocale;
          sendToNative('categoriesLoaded', {
            requestId: requestId,
            categories: venue.categories.map(function (c) {
              var translated = venue.translator.translateCategory(c, locale);
              return { id: c.id, label: (translated && translated.name) || c.id };
            }),
          });
        },

        // Met en avant tous les POI portant la catégorie [categoryId] : pas
        // de méthode SDK dédiée pour "highlight by category", construite ici
        // à partir de primitives — `venue.pois.filter(...)` sur
        // `poi.categories` (un POI peut avoir plusieurs catégories) puis
        // `venue.updateSurface(surface, { color })` par surface de chaque POI
        // trouvé, exactement comme `updateOccupancy`/`setSurfaceInteractive`
        // ci-dessus. Un POI sans surface (marker/label seul) ne se surligne
        // simplement pas visuellement : `poi.surfaces` y est un tableau vide,
        // ce n'est pas un bug. Le natif ([VisioOneController.highlightCategory])
        // est responsable de réinitialiser la catégorie précédemment mise en
        // avant avant d'appeler ceci, pour ne jamais en cumuler deux.
        highlightCategory: function (categoryId) {
          if (!venue) return;
          venue.pois
            .filter(function (poi) {
              return poi.categories.some(function (c) { return c.id === categoryId; });
            })
            .forEach(function (poi) {
              poi.surfaces.forEach(function (surface) {
                venue.updateSurface(surface, { color: '#FF6B00' });
              });
            });
        },

        // Réinitialise ('initial', pas `undefined` — voir
        // docs/features/clickable-surface.md pour la même remarque sur
        // `setSurfaceInteractive` — seul `'initial'` restaure la couleur
        // définie par le bundle de carte) les surfaces de tous les POI
        // portant la catégorie [categoryId].
        clearCategoryHighlight: function (categoryId) {
          if (!venue) return;
          venue.pois
            .filter(function (poi) {
              return poi.categories.some(function (c) { return c.id === categoryId; });
            })
            .forEach(function (poi) {
              poi.surfaces.forEach(function (surface) {
                venue.updateSurface(surface, { color: 'initial' });
              });
            });
        },

        // Requête/réponse (même schéma que loadCustomData / customDataLoaded) :
        // crée un POI purement logique (`venue.createPOI({id: newId})`) — un
        // POI neuf n'a par lui-même aucune représentation visuelle
        // (`images`/`labels`/`lines`/`surfaces`/`markers` tous vides, voir
        // POI.ts du SDK) — puis lui attache immédiatement un Label
        // (`venue.createLabel`) pour le rendre visible/démontrable, dont la
        // position WGS84 est copiée depuis un POI "ancre" déjà existant
        // ([anchorId], résolu comme dans goToPOI/loadCustomData) : son
        // premier label, sinon son premier marker (pas de "tap sur la carte
        // pour placer" dans cette démo). `success: false` avec un `message`
        // explicite dans trois cas, tous des états normaux de la démo, pas
        // des crashs : id [newId] déjà pris (`POIAlreadyExistsError`, voir
        // Errors/POIAlreadyExistsError.ts), ancre introuvable, ou ancre sans
        // label ni marker dont copier la position. Voir
        // docs/features/dynamic-poi-crud.md.
        createDynamicPOI: function (requestId, newId, anchorId, labelText) {
          if (!venue) {
            sendToNative('dynamicPoiCreated', { requestId: requestId, success: false, message: 'Map not ready.' });
            return;
          }

          var anchor = resolveAnchor(anchorId);
          if (anchor.error === 'notFound') {
            sendToNative('dynamicPoiCreated', {
              requestId: requestId,
              success: false,
              message: 'Anchor POI "' + anchorId + '" not found.',
            });
            return;
          }
          if (anchor.error === 'noPosition') {
            sendToNative('dynamicPoiCreated', {
              requestId: requestId,
              success: false,
              message: 'Anchor POI "' + anchorId + '" has no label or marker to copy a position from.',
            });
            return;
          }

          var poi;
          try {
            poi = venue.createPOI({ id: newId });
          } catch (error) {
            // POIAlreadyExistsError (thrown synchronously by venue.createPOI
            // when newId is already used in the venue) — a normal, demoable
            // state for this feature, not a crash.
            sendToNative('dynamicPoiCreated', {
              requestId: requestId,
              success: false,
              message: error && error.message ? error.message : 'Could not create POI "' + newId + '".',
            });
            return;
          }

          var label = venue.createLabel({
            poi: poi,
            position: anchor.position,
            width: 2,
            text: labelText,
          });

          dynamicPoi = poi;
          dynamicPoiLabel = label;
          sendToNative('dynamicPoiCreated', { requestId: requestId, success: true, poiId: newId, text: labelText });
        },

        // Seule "modification" possible du contenu visuel d'un POI dynamique
        // dans cette démo : `venue.updatePOI` ne peut toucher qu'aux
        // catégories du POI (voir POIUpdateOptions.ts), jamais à sa
        // représentation visuelle — c'est `venue.updateLabel` sur le Label
        // attaché à la création qui joue ce rôle ici. Requête/réponse (même
        // schéma que createDynamicPOI ci-dessus). Voir
        // docs/features/dynamic-poi-crud.md.
        updateDynamicPoiLabelText: function (requestId, text) {
          if (!dynamicPoiLabel) {
            sendToNative('dynamicPoiLabelUpdated', {
              requestId: requestId,
              success: false,
              message: 'No dynamic POI tracked.',
            });
            return;
          }
          venue.updateLabel(dynamicPoiLabel, { text: text });
          sendToNative('dynamicPoiLabelUpdated', { requestId: requestId, success: true, text: text });
        },

        // `venue.removePOI` retire le POI ET cascade sur tout élément visuel
        // attaché (ici, le Label créé par createDynamicPOI) : pas besoin d'un
        // removeLabel séparé. Requête/réponse (même schéma que
        // createDynamicPOI ci-dessus). Voir docs/features/dynamic-poi-crud.md.
        removeDynamicPOI: function (requestId) {
          if (!dynamicPoi) {
            sendToNative('dynamicPoiRemoved', {
              requestId: requestId,
              success: false,
              message: 'No dynamic POI tracked.',
            });
            return;
          }
          venue.removePOI(dynamicPoi);
          dynamicPoi = null;
          dynamicPoiLabel = null;
          sendToNative('dynamicPoiRemoved', { requestId: requestId, success: true });
        },

        // `3d-icon-marker` : place une image (icône) au-dessus d'un POI
        // existant (`venue.createImage`), dont il est à la fois le
        // propriétaire (`poi`) et la source de position (via resolveAnchor,
        // partagé avec createDynamicPOI). Une seule image par `imageId` :
        // si une image est déjà placée sous cet id, elle est d'abord retirée.
        // Requête/réponse (même schéma que createDynamicPOI) avec `error` =
        // 'notFound' / 'noPosition' / 'sdk' (message du SDK) en cas d'échec.
        // Voir docs/features/3d-icon-marker.md.
        placeIconImage: function (requestId, imageId, anchorId, url, orientationType) {
          if (!venue) {
            sendToNative('iconImagePlaced', { requestId: requestId, success: false, error: 'sdk', message: 'Map not ready.' });
            return;
          }
          var anchor = resolveAnchor(anchorId);
          if (anchor.error) {
            sendToNative('iconImagePlaced', { requestId: requestId, success: false, error: anchor.error });
            return;
          }
          // `previousRemoved` signale au natif qu'une image précédente a déjà
          // été retirée avant un éventuel échec de createImage (ex. url
          // vide) : l'état devient alors "aucune icône placée".
          var previousRemoved = false;
          try {
            if (iconImages[imageId]) {
              venue.removeImage(iconImages[imageId]);
              delete iconImages[imageId];
              previousRemoved = true;
            }
            iconImages[imageId] = venue.createImage({
              poi: anchor.poi,
              position: anchor.position,
              width: 6,
              height: 6,
              url: url,
              orientationType: orientationType,
            });
          } catch (error) {
            sendToNative('iconImagePlaced', {
              requestId: requestId,
              success: false,
              error: 'sdk',
              message: error && error.message ? error.message : String(error),
              previousRemoved: previousRemoved,
            });
            return;
          }
          sendToNative('iconImagePlaced', { requestId: requestId, success: true, imageId: imageId, poiId: anchorId });
        },

        // `venue.updateImage(image, { orientationType })` sur une image déjà
        // placée par placeIconImage — prend effet immédiatement, sans
        // recréer l'image. Voir docs/features/3d-icon-marker.md.
        updateIconImageOrientation: function (requestId, imageId, orientationType) {
          var image = iconImages[imageId];
          if (!image) {
            sendToNative('iconImageUpdated', { requestId: requestId, success: false, error: 'noImage' });
            return;
          }
          try {
            venue.updateImage(image, { orientationType: orientationType });
          } catch (error) {
            sendToNative('iconImageUpdated', {
              requestId: requestId,
              success: false,
              error: 'sdk',
              message: error && error.message ? error.message : String(error),
            });
            return;
          }
          sendToNative('iconImageUpdated', { requestId: requestId, success: true, orientationType: image.orientationType });
        },

        // `venue.removeImage(image)` : retire l'image de la carte et de
        // `poi.images` du POI ancre. Voir docs/features/3d-icon-marker.md.
        removeIconImage: function (requestId, imageId) {
          var image = iconImages[imageId];
          if (!image) {
            sendToNative('iconImageRemoved', { requestId: requestId, success: false, error: 'noImage' });
            return;
          }
          try {
            venue.removeImage(image);
          } catch (error) {
            sendToNative('iconImageRemoved', {
              requestId: requestId,
              success: false,
              error: 'sdk',
              message: error && error.message ? error.message : String(error),
            });
            return;
          }
          delete iconImages[imageId];
          sendToNative('iconImageRemoved', { requestId: requestId, success: true });
        },

        // `custom-text-label` : place un texte libre sur la carte
        // (`venue.createLabel`), possédé par un POI existant dont la position
        // est copiée via resolveAnchor (partagé avec createDynamicPOI /
        // placeIconImage), décalée de ~4 m (+0.00004° en lat/lng) pour ne pas
        // recouvrir le label propre du POI. `height` est TOUJOURS passé
        // (sinon le SDK le cale sur `width` : boîte carrée, texte déformé).
        // Tout est validé AVANT de toucher au label existant (texte non vide,
        // POI ancre, position issue des données de la carte — jamais de notre
        // propre label, encore attaché à l'ancre) : un échec de validation
        // laisse le label déjà placé intact. Ce n'est qu'ensuite que l'ancien
        // label est retiré et le nouveau créé (un seul à la fois) ;
        // `previousRemoved` signale un échec du SDK après ce retrait.
        // Requête/réponse `textLabelPlaced` avec `error` = 'textRequired' /
        // 'notFound' / 'noPosition' / 'sdk' (message du SDK).
        // Voir docs/features/custom-text-label.md.
        placeTextLabel: function (requestId, anchorId, text, color, width, height, rotation) {
          if (!venue) {
            sendToNative('textLabelPlaced', { requestId: requestId, success: false, error: 'sdk', message: 'Map not ready.' });
            return;
          }
          if (!text || !String(text).trim()) {
            sendToNative('textLabelPlaced', { requestId: requestId, success: false, error: 'textRequired' });
            return;
          }
          var anchor = resolveAnchor(anchorId, textLabel);
          if (anchor.error) {
            sendToNative('textLabelPlaced', { requestId: requestId, success: false, error: anchor.error });
            return;
          }
          var position = {
            latitude: anchor.position.latitude + 0.00004,
            longitude: anchor.position.longitude + 0.00004,
          };
          if (anchor.position.altitude !== undefined) position.altitude = anchor.position.altitude;
          var options = {
            poi: anchor.poi,
            position: position,
            width: width,
            height: height,
            text: text,
            color: color,
            rotation: rotation,
          };
          var previousRemoved = false;
          try {
            if (textLabel) {
              var previous = textLabel;
              textLabel = null;
              textLabelOptions = null;
              previousRemoved = true;
              venue.removeLabel(previous);
            }
            textLabel = venue.createLabel(options);
            textLabelOptions = options;
          } catch (error) {
            sendToNative('textLabelPlaced', {
              requestId: requestId,
              success: false,
              error: 'sdk',
              message: error && error.message ? error.message : String(error),
              previousRemoved: previousRemoved,
            });
            return;
          }
          sendToNative('textLabelPlaced', { requestId: requestId, success: true, poiId: anchorId });
        },

        // `venue.updateLabel(label, changes)` sur le label placé, en direct.
        // `changes` = { text } | { color } | { width, height } — width et
        // height TOUJOURS ensemble (`width` seul remet `height = width`).
        // `rotation` n'est pas accepté ici (voir rotateTextLabel). Réponse
        // `textLabelUpdated`, `error` = 'noLabel' / 'textRequired' / 'sdk'.
        updateTextLabel: function (requestId, changes) {
          if (!textLabel) {
            sendToNative('textLabelUpdated', { requestId: requestId, success: false, error: 'noLabel' });
            return;
          }
          if ('text' in changes && (!changes.text || !String(changes.text).trim())) {
            sendToNative('textLabelUpdated', { requestId: requestId, success: false, error: 'textRequired' });
            return;
          }
          try {
            venue.updateLabel(textLabel, changes);
          } catch (error) {
            sendToNative('textLabelUpdated', {
              requestId: requestId,
              success: false,
              error: 'sdk',
              message: error && error.message ? error.message : String(error),
            });
            return;
          }
          Object.keys(changes).forEach(function (key) { textLabelOptions[key] = changes[key]; });
          sendToNative('textLabelUpdated', { requestId: requestId, success: true });
        },

        // Rotation d'un label placé : absente de `LabelUpdateOptions`, donc
        // removeLabel + createLabel avec les mêmes options (position, taille,
        // texte, couleur courants) et la nouvelle rotation. Réponse
        // `textLabelUpdated` ; en cas d'échec de la recréation, le label a
        // disparu (`previousRemoved`).
        rotateTextLabel: function (requestId, rotation) {
          if (!textLabel) {
            sendToNative('textLabelUpdated', { requestId: requestId, success: false, error: 'noLabel' });
            return;
          }
          var options = Object.assign({}, textLabelOptions, { rotation: rotation });
          try {
            venue.removeLabel(textLabel);
            textLabel = null;
            textLabelOptions = null;
            textLabel = venue.createLabel(options);
            textLabelOptions = options;
          } catch (error) {
            sendToNative('textLabelUpdated', {
              requestId: requestId,
              success: false,
              error: 'sdk',
              message: error && error.message ? error.message : String(error),
              previousRemoved: textLabel === null,
            });
            return;
          }
          sendToNative('textLabelUpdated', { requestId: requestId, success: true });
        },

        // `venue.removeLabel(label)` puis on oublie la référence : un second
        // appel est un no-op côté app (`error: 'noLabel'`) — le SDK, lui,
        // lèverait `Provided label is not registered`.
        removeTextLabel: function (requestId) {
          if (!textLabel) {
            sendToNative('textLabelRemoved', { requestId: requestId, success: false, error: 'noLabel' });
            return;
          }
          try {
            venue.removeLabel(textLabel);
          } catch (error) {
            textLabel = null;
            textLabelOptions = null;
            sendToNative('textLabelRemoved', {
              requestId: requestId,
              success: false,
              error: 'sdk',
              message: error && error.message ? error.message : String(error),
            });
            return;
          }
          textLabel = null;
          textLabelOptions = null;
          sendToNative('textLabelRemoved', { requestId: requestId, success: true });
        },

        // `html-overlay-marker` : épingle un élément HTML (un badge) sur la
        // carte via `venue.createMarker({ poi, position, element })`. Le SDK
        // déplace l'élément dans son propre conteneur d'overlay, au-dessus
        // de la scène 3D (jamais masqué par la géométrie), et en possède la
        // mise en page (position/translate/transform/z-index) : on ne stylise
        // donc ni `transform` ni `position` dessus. Validation AVANT de toucher
        // au badge existant (texte non vide, POI ancre, position issue des
        // données de la carte — jamais de notre propre badge, encore dans
        // `poi.markers`) ; position décalée de ~4 m comme custom-text-label.
        // Le SDK force `pointer-events: none` à la création : on le remet à
        // `auto` juste après, et le `click` est stoppé (stopPropagation) pour
        // ne pas retomber sur la carte (fiche du POI dessous), puis relayé au
        // natif (`htmlBadgeTapped`, `count`). Requête/réponse `htmlBadgePlaced`
        // avec `error` = 'textRequired' / 'notFound' / 'noPosition' / 'sdk',
        // plus `previousRemoved`. Voir docs/features/html-overlay-marker.md.
        placeHtmlBadge: function (requestId, anchorId, text) {
          if (!venue) {
            sendToNative('htmlBadgePlaced', { requestId: requestId, success: false, error: 'sdk', message: 'Map not ready.' });
            return;
          }
          if (!text || !String(text).trim()) {
            sendToNative('htmlBadgePlaced', { requestId: requestId, success: false, error: 'textRequired' });
            return;
          }
          var anchor = resolveAnchor(anchorId, textLabel, htmlBadge);
          if (anchor.error) {
            sendToNative('htmlBadgePlaced', { requestId: requestId, success: false, error: anchor.error });
            return;
          }
          var position = {
            latitude: anchor.position.latitude + 0.00004,
            longitude: anchor.position.longitude + 0.00004,
          };
          if (anchor.position.altitude !== undefined) position.altitude = anchor.position.altitude;

          var element = document.createElement('div');
          element.setAttribute('style', HTML_BADGE_STYLE);
          element.textContent = text;

          var previousRemoved = false;
          try {
            if (htmlBadge) {
              var previous = htmlBadge;
              htmlBadge = null;
              previousRemoved = true;
              venue.removeMarker(previous);
            }
            var marker = venue.createMarker({ poi: anchor.poi, position: position, element: element });
            // Le SDK pose `pointer-events: none` à la création (et ne le
            // réécrit plus ensuite) : sans ça, le badge n'est pas tappable.
            element.style.pointerEvents = 'auto';
            element.addEventListener('click', function (event) {
              event.stopPropagation();
              if (htmlBadge !== marker) return;
              htmlBadgeTapCount += 1;
              sendToNative('htmlBadgeTapped', { count: htmlBadgeTapCount });
            });
            htmlBadge = marker;
            htmlBadgeTapCount = 0;
          } catch (error) {
            sendToNative('htmlBadgePlaced', {
              requestId: requestId,
              success: false,
              error: 'sdk',
              message: error && error.message ? error.message : String(error),
              previousRemoved: previousRemoved,
            });
            return;
          }
          sendToNative('htmlBadgePlaced', { requestId: requestId, success: true, poiId: anchorId });
        },

        // Change le texte du badge : simple édition DOM de `marker.element`
        // (nœud vivant), aucun appel SDK. Réponse `htmlBadgeUpdated`,
        // `error` = 'noBadge' / 'textRequired'.
        updateHtmlBadgeText: function (requestId, text) {
          if (!htmlBadge) {
            sendToNative('htmlBadgeUpdated', { requestId: requestId, success: false, error: 'noBadge' });
            return;
          }
          if (!text || !String(text).trim()) {
            sendToNative('htmlBadgeUpdated', { requestId: requestId, success: false, error: 'textRequired' });
            return;
          }
          htmlBadge.element.textContent = text;
          sendToNative('htmlBadgeUpdated', { requestId: requestId, success: true });
        },

        // `venue.updateMarker(marker, { isVisible })` : `false` passe
        // l'élément en `display: none` (il reste dans le DOM). Réponse
        // `htmlBadgeUpdated`, `error` = 'noBadge' / 'sdk'.
        setHtmlBadgeVisible: function (requestId, visible) {
          if (!htmlBadge) {
            sendToNative('htmlBadgeUpdated', { requestId: requestId, success: false, error: 'noBadge' });
            return;
          }
          try {
            venue.updateMarker(htmlBadge, { isVisible: visible });
          } catch (error) {
            sendToNative('htmlBadgeUpdated', {
              requestId: requestId,
              success: false,
              error: 'sdk',
              message: error && error.message ? error.message : String(error),
            });
            return;
          }
          sendToNative('htmlBadgeUpdated', { requestId: requestId, success: true, visible: visible });
        },

        // `venue.removeMarker(marker)` (le SDK détache aussi l'élément du
        // DOM) puis on oublie la référence : un second appel est un no-op
        // côté app (`error: 'noBadge'`) — le SDK, lui, lèverait
        // `Provided marker is not registered`.
        removeHtmlBadge: function (requestId) {
          if (!htmlBadge) {
            sendToNative('htmlBadgeRemoved', { requestId: requestId, success: false, error: 'noBadge' });
            return;
          }
          var marker = htmlBadge;
          htmlBadge = null;
          try {
            venue.removeMarker(marker);
          } catch (error) {
            sendToNative('htmlBadgeRemoved', {
              requestId: requestId,
              success: false,
              error: 'sdk',
              message: error && error.message ? error.message : String(error),
            });
            return;
          }
          sendToNative('htmlBadgeRemoved', { requestId: requestId, success: true });
        },

        // Requête/réponse (même schéma que getVenueLayout / venueLayout) :
        // renvoie la locale courante (`venue.currentLocale`) et la liste des
        // locales disponibles pour cette venue (`venue.translator.allLocales`).
        // Sur la carte de démo partagée, `allLocales` vaut
        // `['default', 'en', 'fr']` où `'default'` s'avère être un doublon
        // (octet pour octet identique, confirmé en direct) du français —
        // c'est le natif qui ne présente que `'en'`/`'fr'` à l'utilisateur,
        // pas ce pont. Voir docs/features/runtime-locale.md.
        getLocales: function (requestId) {
          if (!venue) {
            sendToNative('localesLoaded', { requestId: requestId, currentLocale: null, allLocales: [] });
            return;
          }
          sendToNative('localesLoaded', {
            requestId: requestId,
            currentLocale: venue.currentLocale,
            allLocales: venue.translator.allLocales,
          });
        },

        // Change la locale courante de la venue (`venue.setCurrentLocale`,
        // `Promise<void>`). D'après sa TSDoc (Venue.ts) le SDK se charge
        // lui-même de re-rendre les labels de POI (via leur `POILocaleEntry`
        // pour cette locale) et toute UI courante (dont la Navigation en
        // cours) dans la nouvelle locale dès que la Promise se résout —
        // aucun re-fetch manuel de données POI n'est nécessaire côté natif,
        // ni aucun message de confirmation dédié : le résultat est
        // directement observable sur la carte. Voir
        // docs/features/runtime-locale.md.
        setCurrentLocale: function (locale) {
          if (!venue) return;
          venue.setCurrentLocale(locale).catch(function (error) {
            console.error('[MapBridge] setCurrentLocale a échoué:', error);
          });
        },

        // `custom-theme` : liste des thèmes de scène 3D enregistrés
        // (`view.themes`, lecture seule — `['day', 'night', 'goldenHour']`
        // sur 1.0.9). Requête/réponse `themesLoaded` ({requestId, themes}) ;
        // `themes` vide si la carte n'est pas prête. Il n'existe pas de
        // getter du thème courant en 1.0.9 : c'est le natif qui le suit.
        // Voir docs/features/custom-theme.md.
        getThemes: function (requestId) {
          sendToNative('themesLoaded', {
            requestId: requestId,
            themes: view ? view.themes.slice() : [],
          });
        },

        // `view.setTheme(name)` : change uniquement l'éclairage de la scène
        // 3D (lumières directionnelle + ambiante), jamais l'UI — et sans
        // effet visible si la vue n'a pas été créée avec
        // `enableShadows: true` (voir `setup`). Lève
        // `Cannot apply given theme <name> as it isn't registered.` pour un
        // id absent de `view.themes` : rapporté via `themeApplied`.
        setTheme: function (name) {
          if (!view) return;
          try {
            view.setTheme(name);
            sendToNative('themeApplied', { success: true, theme: name });
          } catch (error) {
            console.error('[MapBridge] setTheme a échoué:', error);
            sendToNative('themeApplied', {
              success: false,
              theme: name,
              message: error && error.message ? error.message : String(error),
            });
          }
        },

        // `view.accentColor` / `view.textAccentColor` : propriétés
        // assignables, appliquées en direct à l'UI du SDK (bouton "Go" de la
        // fiche POI, "Add a step"...). Une valeur qui n'est ni hex, ni rgba,
        // ni hsl lève `Invalid color format provided...` : rapporté via
        // `accentColorsApplied`.
        setAccentColors: function (accentColor, textAccentColor) {
          if (!view) return;
          try {
            view.accentColor = accentColor;
            view.textAccentColor = textAccentColor;
            sendToNative('accentColorsApplied', { success: true });
          } catch (error) {
            console.error('[MapBridge] setAccentColors a échoué:', error);
            sendToNative('accentColorsApplied', {
              success: false,
              message: error && error.message ? error.message : String(error),
            });
          }
        },

        // `add-locale` : ajoute une locale `'es'` jamais authorée dans
        // VisioMapEditor pour cette carte (`venue.translator.addLocale`,
        // synchrone, void) puis relit chaque clé de `resources` via
        // `venue.translator.translate(key, 'es')` (également synchrone) dans
        // le même aller-retour de pont, comme `loadCustomData` ci-dessus
        // enchaîne `refreshCustomData`/`getPOICustomData`. `addLocale` est
        // backé par un bundle i18next générique, complètement séparé des
        // données de traduction propres à la venue (POI/étage/bâtiment,
        // elles, sont parsées une fois au chargement depuis le JSON de la
        // carte publiée) : il ne peut jamais changer le nom d'un POI/label
        // sur la carte, seulement les clés d'UI/nav prédéfinies du SDK et les
        // clés applicatives arbitraires. Voir docs/features/add-locale.md.
        addSpanishLocale: function (requestId, resources) {
          if (!venue) {
            sendToNative('spanishLocaleAdded', { requestId: requestId, values: {} });
            return;
          }
          venue.translator.addLocale('es', resources);
          var values = {};
          Object.keys(resources).forEach(function (key) {
            values[key] = venue.translator.translate(key, 'es');
          });
          sendToNative('spanishLocaleAdded', { requestId: requestId, values: values });
        },
      };

      // Permet de tester map.html directement dans un navigateur (npm run dev)
      // sans passer par la WebView Flutter.
      window.addEventListener('DOMContentLoaded', function () {
        sendToNative('pageReady', null);
      });
    })();
  </script>
</body>
</html>
