<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <title>VisioOne Map</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
    }
    #container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
  <!--
    Bundle UMD (pas le build ESM `visioone.js`) : chargé comme script classique,
    il fonctionne aussi bien servi depuis l'origine interne d'Android que
    depuis file:// (iOS), contrairement au build ESM dont les `import()`
    dynamiques échouent sous file:// à cause des restrictions CORS de WebKit.
    Voir docs/ARCHITECTURE.md.
  -->
  <script src="visioone.umd.cjs"></script>
</head>
<body>
  <div id="container"></div>

  <!--
    Pont JS <-> Native, en scripts classiques exécutés dans cet ordre (pas de
    `type="module"` : sous file:// (iOS), WebKit bloque les imports de
    modules ES pour cause de CORS, comme pour le build ESM du SDK) :
      1. bridge/core.js : chargement de la carte (`MapBridge.setup`), canal
         unique JS -> Native `{type, data}`, helpers partagés, API
         d'enregistrement `window.MapCore` ;
      2. features/<slug>.js : une feature par fichier (même slug que
         docs/features/<slug>.md), qui ajoute ses commandes à
         `window.MapBridge` et ses listeners de vue. Ordre indifférent entre
         features. Ajouter une feature = ajouter son fichier ET sa balise ici.
    Tous ces scripts ont fini de s'exécuter avant `onPageFinished` côté Dart,
    donc avant le premier appel à `MapBridge.setup`. Voir docs/ARCHITECTURE.md.
  -->
  <script src="bridge/core.js"></script>
  <script src="features/3d-icon-marker.js"></script>
  <script src="features/accuracy-circle-style.js"></script>
  <script src="features/add-locale.js"></script>
  <script src="features/auth-token.js"></script>
  <script src="features/camera-lock-on-position.js"></script>
  <script src="features/camera-projection-toggle.js"></script>
  <script src="features/camera-showcase-carousel.js"></script>
  <script src="features/category-highlight.js"></script>
  <script src="features/clickable-surface.js"></script>
  <script src="features/compute-navigation.js"></script>
  <script src="features/custom-data.js"></script>
  <script src="features/custom-navigation-trace.js"></script>
  <script src="features/custom-text-label.js"></script>
  <script src="features/custom-theme.js"></script>
  <script src="features/dynamic-poi-crud.js"></script>
  <script src="features/explore-mode.js"></script>
  <script src="features/floor-selector.js"></script>
  <script src="features/geofencing.js"></script>
  <script src="features/goto-poi.js"></script>
  <script src="features/html-overlay-marker.js"></script>
  <script src="features/navigation-exclude-modalities.js"></script>
  <script src="features/occupancy-simulated.js"></script>
  <script src="features/poi-click.js"></script>
  <script src="features/reset-view.js"></script>
  <script src="features/runtime-locale.js"></script>
  <script src="features/simulated-position.js"></script>
  <script src="features/ui-part-visibility.js"></script>
</body>
</html>
